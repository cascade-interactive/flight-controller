#pinmap .sig.sys{opacity:.8;}
#pinmap .chip-name{font-size:19px;font-weight:700;letter-spacing:.01em;fill:#AEB6C2;}
#pinmap .chip-pkg{font-size:12px;font-style:italic;fill:#6E7681;letter-spacing:.14em;}
#pinmap .g-spi1 .pad{fill:#E0812F;stroke:none;}#pinmap .g-spi1 .pad-txt{fill:#fff;}#pinmap .g-spi1 .sig{fill:#E0812F;}
#pinmap .g-spi2 .pad{fill:#D63A4E;stroke:none;}#pinmap .g-spi2 .pad-txt{fill:#fff;}#pinmap .g-spi2 .sig{fill:#D63A4E;}
#pinmap .g-i2c1 .pad{fill:#A06BDB;stroke:none;}#pinmap .g-i2c1 .pad-txt{fill:#fff;}#pinmap .g-i2c1 .sig{fill:#A06BDB;}
#pinmap .g-motor .pad{fill:#35A45F;stroke:none;}#pinmap .g-motor .pad-txt{fill:#fff;}#pinmap .g-motor .sig{fill:#35A45F;}
#pinmap .g-usb .pad{fill:#D059A8;stroke:none;}#pinmap .g-usb .pad-txt{fill:#fff;}#pinmap .g-usb .sig{fill:#D059A8;}
#pinmap .g-swd .pad{fill:#8B95A5;stroke:none;}#pinmap .g-swd .pad-txt{fill:#fff;}#pinmap .g-swd .sig{fill:#8B95A5;}
#pinmap .g-usart1 .pad{fill:#3E8FD9;stroke:none;}#pinmap .g-usart1 .pad-txt{fill:#fff;}#pinmap .g-usart1 .sig{fill:#3E8FD9;}
#pinmap .g-usart2 .pad{fill:#16A8A0;stroke:none;}#pinmap .g-usart2 .pad-txt{fill:#fff;}#pinmap .g-usart2 .sig{fill:#16A8A0;}
#pinmap .g-usart3 .pad{fill:#6D7FE0;stroke:none;}#pinmap .g-usart3 .pad-txt{fill:#fff;}#pinmap .g-usart3 .sig{fill:#6D7FE0;}
#pinmap .g-lpuart .pad{fill:#2FB0C7;stroke:none;}#pinmap .g-lpuart .pad-txt{fill:#fff;}#pinmap .g-lpuart .sig{fill:#2FB0C7;}
#pinmap .g-leds .pad{fill:#A98514;stroke:none;}#pinmap .g-leds .pad-txt{fill:#fff;}#pinmap .g-leds .sig{fill:#A98514;}
#pinmap .g-analog .pad{fill:#66892B;stroke:none;}#pinmap .g-analog .pad-txt{fill:#fff;}#pinmap .g-analog .sig{fill:#66892B;}
#pinmap .g-other .pad{fill:#7D8590;stroke:none;}#pinmap .g-other .pad-txt{fill:#fff;}#pinmap .g-other .sig{fill:#7D8590;}
</style>
